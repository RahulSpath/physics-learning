troke="#b5561f" stroke-width="2"/><polygon points="345,155 355,155 350,165" fill="#b5561f"/><text x="356" y="111.5" font-size="11.5" fill="#b5561f">508.73</text><text x="20" y="24" font-size="11.5" fill="#5a6478">Energies in cm⁻¹, from the four measured lines. Not to scale: the ³P levels are spread out for clarity.</text><text x="20" y="424" font-size="11.5" fill="#5a6478">Order of the chain: 326.20 nm gives ³P₁; adding 480.12 nm gives ³S₁;</text><text x="20" y="440" font-size="11.5" fill="#5a6478">subtracting 467.94 nm and 508.73 nm then gives ³P₀ and ³P₂.</text></svg>